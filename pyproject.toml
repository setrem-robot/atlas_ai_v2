[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboteye"
version = "2.0.0"
description = "Atlas: face robotica animada com IA local e voz (LLM + TTS)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kerlon Ribeiro" }]
keywords = ["atlas", "tts", "piper", "ollama", "raspberry-pi", "pygame", "robot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "pygame>=2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # A face desenha os olhos como campos de distancia amostrados em numpy: e o
    # que da borda limpa em qualquer tamanho e movimento abaixo do pixel.
    "numpy>=1.24",
]

[project.optional-dependencies]
# Voz local (padrao). Sem isso o projeto cai para o motor remoto ou silencioso.
tts = [
    "piper-tts>=1.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
]
# Vozes de qualidade mais alta (24 kHz). Pesa mais na CPU que o Piper: vale numa
# maquina de mesa, pesa num Raspberry Pi.
kokoro = [
    "kokoro-onnx>=0.4",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
]
# Vozes neurais da Microsoft, pela rede. Em pt-BR sao as mais naturais que
# temos; em troca precisam de internet e chegam em MP3, que o miniaudio decodifica.
online = [
    "edge-tts>=7.0",
    "miniaudio>=1.59",
    "sounddevice>=0.4.6",
]
# Reconhecimento de fala offline, em portugues. Wheel para aarch64 existe, e o
# modelo (52 MB) vem a parte: `./scripts/baixar-modelo-escuta.sh`.
stt = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
]
# Bluetooth: o celular fala com o Pi direto, sem ESP32. O `bluezero` precisa do
# python3-dbus e python3-gi do sistema (o setup instala), e o `paho-mqtt` e como
# o comando chega aos motores.
ble = [
    "bluezero>=0.9",
    "paho-mqtt>=2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
roboteye = "roboteye.cli:main"

[project.urls]
Homepage = "https://github.com/setrem-robot/IAv2"
Repository = "https://github.com/setrem-robot/IAv2"

[tool.hatch.build.targets.wheel]
packages = ["src/roboteye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
# Sem `python_version` fixo: o mypy usa o interpretador atual. A compatibilidade
# com o mínimo suportado (3.10) é garantida pela matriz de testes do CI.
packages = ["roboteye"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Dependências opcionais sem stubs — carregadas dinamicamente em tempo de execução.
module = ["piper.*", "sounddevice.*", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
